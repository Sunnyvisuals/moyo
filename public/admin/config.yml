      - { name: short, label: Accroche, widget: object, fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }] }
      - { name: description, label: Description, widget: object, fields: [{ name: fr, label: FR, widget: text }, { name: en, label: EN, widget: text }] }
      - name: deliverables
        label: Livrables
        widget: list
        fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }]
      - { name: order, label: Ordre, widget: number, value_type: int, default: 0 }
      - { name: draft, label: Masqué, widget: boolean, default: false }

