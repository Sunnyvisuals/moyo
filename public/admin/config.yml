      - { name: line, label: Phrase, widget: object, fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }] }
      - name: theme
        label: Ambiance visuelle des pages projet
        widget: select
        options:
          - { label: "Luxe — laiton sur nuit", value: luxe }
          - { label: "Hôtellerie — pierre de l'Estérel", value: hotellerie }
          - { label: "Yachting — bleu de nuit", value: yachting }
          - { label: "Événementiel — lumière de scène", value: evenementiel }
          - { label: "Startup — métal liquide", value: startup }
      - { name: order, label: Ordre, widget: number, value_type: int, default: 0 }

  - name: team
    label: Équipe
    label_singular: Membre
    folder: src/content/team
    extension: yaml
