      - { name: name, label: Nom, widget: string }
      - { name: kind, label: Type, widget: select, options: [{ label: Client, value: client }, { label: Partenaire du réseau, value: partner }] }
      - { name: field, label: Domaine, widget: object, fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }] }
      - { name: url, label: Site web, widget: string, required: false }
      - { name: order, label: Ordre, widget: number, value_type: int, default: 0 }
      - { name: placeholder, label: Exemple, widget: boolean, default: false }

  - name: settings
    label: Réglages
    files:
      - name: site
        label: Coordonnées, showreel & SEO
        file: src/content/settings/site.yaml
        fields:
          - { name: email, label: E-mail, widget: string }
          - { name: phone, label: Téléphone, widget: string, required: false }
          - { name: region, label: Région, widget: object, fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }] }
          - { name: coordinates, label: Coordonnées affichées, widget: string }
          - { name: socials, label: Réseaux sociaux, widget: list, fields: [{ name: label, label: Nom, widget: string }, { name: url, label: URL, widget: string }] }
          - name: showreel
            label: Showreel
            widget: object
            fields:
              - { name: mode, label: Affichage, widget: select, options: [{ label: Masqué, value: hidden }, { label: Emplacement réservé, value: teaser }, { label: Vidéo, value: video }] }
              - { name: url, label: "URL de la vidéo (MP4)", widget: string, required: false }
              - { name: title, label: Titre, widget: object, fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }] }
          - name: seo
            label: SEO
