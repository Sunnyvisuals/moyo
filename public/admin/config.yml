# Admin moyo — Sveltia CMS (compatible Decap CMS).
# Chaque enregistrement crée un commit sur GitHub → Cloudflare Pages redéploie automatiquement.
backend:
  name: github
  repo: VOTRE-COMPTE/moyo-site   # ← à remplacer
  branch: main
  commit_messages:
    create: "contenu : ajoute {{collection}} « {{slug}} »"
    update: "contenu : modifie {{collection}} « {{slug}} »"
    delete: "contenu : supprime {{collection}} « {{slug}} »"

locale: fr
site_url: https://moyo.example
media_folder: src/assets/uploads
public_folder: ../../assets/uploads
slug: { encoding: ascii, clean_accents: true }

collections:
  - name: projects
    label: Projets
    label_singular: Projet
    folder: src/content/projects
    extension: yaml
    format: yaml
    create: true
    identifier_field: title
    summary: "{{title}} · {{year}}"
    sortable_fields: [order, year, title]
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: client, label: Client, widget: string }
      - { name: year, label: Année, widget: number, value_type: int }
      - name: location
        label: Lieu
        widget: object
        fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }]
      - { name: sectors, label: Secteurs, widget: relation, collection: sectors, search_fields: [title.fr], value_field: "{{slug}}", display_fields: [title.fr], multiple: true }
      - { name: disciplines, label: Disciplines, widget: relation, collection: services, search_fields: [title.fr], value_field: "{{slug}}", display_fields: [title.fr], multiple: true }
      - { name: cover, label: Image de couverture, widget: image }
      - name: coverAlt
        label: Texte alternatif de la couverture
        widget: object
        fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }]
      - name: summary
        label: Résumé
        widget: object
        fields: [{ name: fr, label: FR, widget: text }, { name: en, label: EN, widget: text }]
      - name: blocks
        label: Étude de cas (blocs)
        widget: list
        types:
          - name: text
            label: Texte
            fields:
              - { name: title, label: Intertitre, widget: object, required: false, fields: [{ name: fr, label: FR, widget: string, required: false }, { name: en, label: EN, widget: string, required: false }] }
              - { name: body, label: Texte, widget: object, fields: [{ name: fr, label: FR, widget: text }, { name: en, label: EN, widget: text }] }
          - name: image
            label: Image
            fields:
              - { name: src, label: Image, widget: image }
              - { name: layout, label: Format, widget: select, options: [{ label: Pleine largeur, value: full }, { label: En retrait, value: inset }], default: full }
              - { name: alt, label: Texte alternatif, widget: object, fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }] }
          - name: diptych
            label: Deux images
            fields:
              - { name: left, label: Image gauche, widget: image }
              - { name: right, label: Image droite, widget: image }
              - { name: alt, label: Texte alternatif, widget: object, fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }] }
          - name: video
            label: Vidéo
            fields:
              - { name: url, label: "URL du fichier MP4 (Cloudflare R2 / Stream)", widget: string }
              - { name: caption, label: Légende, widget: object, required: false, fields: [{ name: fr, label: FR, widget: string, required: false }, { name: en, label: EN, widget: string, required: false }] }
          - name: quote
            label: Citation
            fields:
              - { name: body, label: Citation, widget: object, fields: [{ name: fr, label: FR, widget: text }, { name: en, label: EN, widget: text }] }
              - { name: author, label: Auteur, widget: string, required: false }
      - name: credits
        label: Crédits
        widget: list
        required: false
        fields:
          - { name: role, label: Rôle, widget: object, fields: [{ name: fr, label: FR, widget: string }, { name: en, label: EN, widget: string }] }
          - { name: name, label: Nom, widget: string }
      - { name: featured, label: "Mis en avant sur l'accueil", widget: boolean, default: false }
      - { name: order, label: "Ordre d'affichage", widget: number, value_type: int, default: 0 }
      - { name: placeholder, label: "Projet d'exemple (affiche la mention « exemple »)", widget: boolean, default: false }
      - { name: draft, label: Brouillon (non publié), widget: boolean, default: false }

  - name: services
    label: Services
    label_singular: Service
    folder: src/content/services
    extension: yaml
    format: yaml
    create: true
    identifier_field: title.fr
    summary: "{{title.fr}}"
    sortable_fields: [order]
