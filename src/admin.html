<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAFAF8">
<title>Admin · Moyo Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="preload" href="/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
__CSS__
/* ---------- Admin: the same system as the site (shared/design.js), the same axes, the same dot. Behaviour: admin.js ---------- */
:root{--max:clamp(1480px,62vw,2000px);--red:#B3261E}
html{scroll-padding-top:calc(var(--hdr) + 24px)}
body{min-height:100vh;min-height:100svh}
.lg-mark,.ab-mark{display:inline-flex;align-items:center;min-height:44px;font-size:clamp(1.5rem,calc(var(--w) * .0204),2.25rem);font-weight:700;letter-spacing:-.052em;line-height:1;margin-left:-.06em}
.tx{display:inline-flex;align-items:center;gap:.4em;min-height:40px;font-size:var(--fs-small);font-weight:600;transition:color .3s}
.tx:hover{color:var(--klein)}.tx.red:hover{color:var(--red)}.tx:disabled{opacity:.4;pointer-events:none}
.btn.red{--c:var(--red)}
.btn:disabled{opacity:.3;cursor:default}

/* Password: the wordmark looks at you, and shuts its eyes while you write */
.lg{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:clip}
.lg-top{height:var(--hdr);padding:0 var(--edge);display:flex;align-items:center;flex:none}
.lg-g{flex:1 0 auto;padding:clamp(1.5rem,6vh,5rem) var(--edge) clamp(2rem,6vh,5rem);align-items:start;row-gap:clamp(2rem,5vw,4rem)}
.lg h1{font-size:clamp(2.75rem,calc(var(--w) * .074),9.5rem);outline:none}
.lg-p{max-width:32ch;margin-top:clamp(1.5rem,2.4vw,2.5rem);color:var(--mute)}
.lg-f{display:grid;gap:clamp(1.75rem,2.6vw,2.75rem);padding-top:clamp(0rem,.6vw,.75rem)}
.lg-a{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px}
.lg-n{font-size:var(--fs-small);color:var(--mute);max-width:46ch}
.lg-mono{flex:none;margin:0 var(--edge)}
.pwd{position:relative}
.pwd input{padding-right:6.2em!important}
.pwd .tx{position:absolute;right:0;bottom:6px}
.str{display:flex;align-items:center;gap:14px;font-size:var(--fs-small);color:var(--mute);margin-top:14px}
.str .f-dots{margin:0}

/* Bar */
.ab{position:sticky;top:0;z-index:60;height:var(--hdr);padding:0 var(--edge);display:flex;align-items:center;gap:clamp(14px,2vw,36px);background:var(--bg);box-shadow:0 1px 0 rgb(18 18 20 / 0);transition:box-shadow .4s}
.ab.on{box-shadow:0 1px 0 var(--line)}
.ab-mark{margin-right:auto}
.ab-st{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-small);font-weight:500;color:var(--mute);transition:color .4s}
.ab-st i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgb(18 18 20 / .35);transition:background .4s,box-shadow .4s}
.ab-st.dirty{color:var(--ink)}.ab-st.dirty i{background:var(--klein);box-shadow:none}
.ab-st.busy i{animation:busy 1s var(--ease-io) infinite;background:var(--klein);box-shadow:none}
.ab .btn{font-size:var(--fs-body)}

/* The way, always open here: a line, a dot, the names */
.ad{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);align-items:start;padding:clamp(1rem,2.4vw,2.75rem) var(--edge) clamp(7rem,12vw,12rem)}
.aw{--row:clamp(42px,calc(var(--w) * .029),56px);grid-column:1/4;position:sticky;top:calc(var(--hdr) + clamp(1rem,2.4vw,2.75rem))}
.aw ol{position:relative;padding-left:28px}
.aw-l{position:absolute;left:5px;top:calc(var(--row) / 2);bottom:calc(var(--row) / 2);width:1px;background:rgb(18 18 20 / .2)}
.aw-d{position:absolute;left:0;top:calc(var(--row) / 2 - 5.5px);width:11px;height:11px;border-radius:50%;background:var(--klein);translate:0 calc(var(--at,0) * var(--row));transition:translate .8s var(--ease)}
.aw a{display:inline-flex;align-items:center;height:var(--row);font-weight:600;color:var(--mute);transition:color .3s}
.aw a[aria-current]{color:var(--ink)}
.aw a:hover{color:var(--klein)}
.aw sup{font-size:.7em;font-weight:500;line-height:0;margin-left:.35em;translate:0 -.1em}
.aw .new sup{color:var(--klein);font-weight:700}
.aw-x{display:grid;justify-items:start;margin-top:clamp(1rem,2vw,2rem);padding-left:28px}
.aw-x .tx{color:var(--mute)}.aw-x .tx:hover{color:var(--klein)}

/* Views */
.av{grid-column:4/-1;min-width:0;outline:none}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 32px;margin-bottom:clamp(2rem,3.8vw,4.25rem)}
.vh h1{outline:none;padding-top:.18em}
.vh .dot b{animation:fall 1.05s linear(0,.0157,.0625,.1406,.25,.3906,.5625,.7656,1 36.4%,.8906 45.5%,.8125 50%,.7656 54.5%,.75 59%,.7656 63.6%,.8125 68.2%,.8906 72.7%,1 77.3%,.9531,.9375 86.4%,.9531,1 95.5%,.9844,1) .15s both}
@keyframes fall{from{translate:0 -1.35em;opacity:0}12%{opacity:1}}
.vn{max-width:54ch;margin:calc(clamp(2rem,3.8vw,4.25rem) * -.45) 0 clamp(2rem,3.8vw,4.25rem);color:var(--mute)}
.vb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 32px;margin-bottom:clamp(.75rem,1.6vw,1.75rem)}
.av .crumbs{margin:0}
.seg{display:inline-flex;gap:20px;font-size:var(--fs-small)}
.seg button{min-height:40px;font-weight:600;color:var(--mute);background:linear-gradient(currentColor,currentColor) 0 calc(100% - 8px)/0 1px no-repeat;transition:background-size .7s var(--ease),color .3s}
.seg button[aria-pressed=true]{color:var(--ink);background-size:100% 1px}
.seg button:hover{color:var(--klein)}
.m9{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));column-gap:var(--gut);row-gap:clamp(2rem,4vw,4rem);align-items:start}
.sct{margin-top:clamp(3.5rem,6vw,6.5rem);border-top:1px solid var(--line);padding-top:clamp(1.25rem,2vw,2rem)}
.sct>h2,.sh{font-size:inherit;font-weight:600;margin-bottom:clamp(1.25rem,2vw,2rem)}
.none{padding:clamp(3rem,7vw,7rem) 0;color:var(--mute)}
.none b{display:block;width:72px;aspect-ratio:1;border-radius:50%;background:var(--klein);margin-bottom:28px}

/* Rows that can be moved */
.grip{display:grid;place-items:center;width:40px;height:44px;color:rgb(18 18 20 / .4);cursor:grab;touch-action:none;transition:color .3s}
.grip::before{content:"";width:12px;height:18px;background:radial-gradient(circle at 3px 3px,currentColor 1.6px,#0000 1.9px) 0 0/6px 6px}
.grip:hover{color:var(--klein)}
[data-s]{transition:translate .5s var(--ease),opacity .4s}
[data-s].drag{z-index:5;transition:none;pointer-events:none}
.sorting{user-select:none;-webkit-user-select:none}
.sorting [data-s]:not(.drag){opacity:.42}
.rw{border-top:1px solid var(--line)}
.rw>li{position:relative;display:flex;align-items:center;gap:clamp(10px,1.4vw,24px);border-bottom:1px solid var(--line);background:var(--bg)}
.rw .grip{margin-left:-12px;flex:none}
.rw-o{flex:1;min-width:0;display:flex;align-items:center;gap:clamp(14px,1.7vw,30px);padding:14px 0;text-align:left}
.rw-o .plate{flex:none;width:clamp(48px,calc(var(--w) * .044),84px)}
.rw-o .plate--none::after{width:40%}
.rw-t{display:block;min-width:0;font-size:var(--fs-row);font-weight:600;letter-spacing:-.034em;line-height:1.12;overflow-wrap:anywhere;transition:color .4s}
.rw-o:hover .rw-t{color:var(--klein)}
.rw-s{display:block;margin-top:4px;font-size:var(--fs-small);color:var(--mute)}
.rw-a{flex:none;width:clamp(11px,1vw,16px);aspect-ratio:1;border-top:2px solid currentColor;border-right:2px solid currentColor;rotate:45deg;margin-right:6px;transition:translate .6s var(--ease)}
.rw-o:hover .rw-a{translate:6px 0;color:var(--klein)}
/* yes or no: a dot */
.tg{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:var(--fs-small);font-weight:500;cursor:pointer;position:relative;white-space:nowrap;transition:color .3s}
.tg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.tg i{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgb(18 18 20 / .4);transition:background .35s,box-shadow .35s,scale .5s var(--ease)}
.tg input:checked+i{background:var(--klein);box-shadow:none}
.tg:hover{color:var(--klein)}.tg:hover i{scale:1.15}.tg:active i{scale:.85}
.tg input:focus-visible+i{outline:2px solid var(--klein);outline-offset:4px}

/* Fields */
.vt{display:block;width:100%;margin:0 0 clamp(1.5rem,2.6vw,2.75rem);padding:0 0 .1em;border:0;border-bottom:1px solid #0000;background:none;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.048em;line-height:1.06;color:var(--ink);resize:none;overflow:hidden;outline:none;field-sizing:content;transition:border-color .4s}
.vt::placeholder{color:rgb(18 18 20 / .22)}
.vt:hover{border-color:var(--line)}.vt:focus{border-color:var(--klein)}.vt[aria-invalid]{border-color:var(--red)}
.ef{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(1.75rem,2.8vw,3rem) var(--gut)}
.ef>.w2{grid-column:1/-1}
.fld ::placeholder{color:rgb(18 18 20 / .34)}
.ed-p{grid-column:1/4}.ed-f{grid-column:4/-1}
.ed-p .plate img{position:static;width:100%;height:auto;aspect-ratio:auto}
.ed-p .plate:not(.plate--none){aspect-ratio:auto}
.hint{font-size:var(--fs-small);color:var(--mute);margin-top:8px}

/* Files: dropped, chosen or pasted */
.dz{position:relative;display:block;cursor:pointer}
.dz>input{position:absolute;inset:0;z-index:2;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.dz.over{outline:2px solid var(--klein);outline-offset:6px}
.dz.plate--none:hover::after{scale:1.12}.dz.plate--none.over::after{scale:1.5}
.dz:has(input:focus-visible){outline:2px solid var(--klein);outline-offset:6px}
.up{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgb(250 250 248 / .88);opacity:0;visibility:hidden;transition:opacity .3s}
.busy>.up{opacity:1;visibility:visible}
.up i{width:72px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--klein) calc(var(--u,0) * 1%),rgb(18 18 20 / .14) 0);mask:radial-gradient(closest-side,#0000 calc(100% - 6px),#000 calc(100% - 5px))}
.pa{display:flex;flex-wrap:wrap;gap:0 24px;margin-top:8px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gut)}
.gal>*{position:relative;aspect-ratio:4/3;background:var(--tint);overflow:clip}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gal .grip,.gal .x{position:absolute;top:8px;width:44px;height:44px;border-radius:50%;background:var(--bg);color:var(--ink)}
.gal .grip{left:8px}.gal .x{right:8px;display:grid;place-items:center;font-size:1.1rem;line-height:1;transition:color .3s}
.gal .x:hover{color:var(--red)}
.gal .dz::after{width:22%}

/* Method: what is seen is what is edited */
.mt{position:relative;container-type:inline-size;aspect-ratio:16/9;background:var(--klein);color:var(--bg);overflow:clip}
.mt>.dz{position:absolute;inset:0}
.mt :is(img,video){position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% var(--fy,50%)}
.mt[data-fit=top]{--fy:8%}.mt[data-fit=bottom]{--fy:92%}
.mt[data-fit=contain].has{background:var(--ink)}.mt[data-fit=contain] :is(img,video){object-fit:contain}
.mt:not(.has)>.dz::after{content:"";position:absolute;left:50%;top:50%;height:30%;aspect-ratio:1;border-radius:50%;background:var(--bg);translate:-50% -50%;transition:scale 1.2s var(--ease)}
.mt:not(.has)>.dz:hover::after{scale:1.1}.mt:not(.has)>.dz.over::after{scale:1.4}
.mt.has::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,rgb(18 18 20 / .86),rgb(18 18 20 / .66) 26%,rgb(18 18 20 / .44) 46%,rgb(18 18 20 / 0) 74%),linear-gradient(to right,rgb(18 18 20 / .46),rgb(18 18 20 / 0) 60%)}
.mt-w{position:absolute;z-index:4;left:3.2cqw;right:3.2cqw;bottom:3cqw;pointer-events:none}
.mt-w textarea{display:block;width:min(100%,46cqw);border:0;border-bottom:1px solid #0000;background:none;color:inherit;padding:0 0 .1em;resize:none;overflow:hidden;outline:none;pointer-events:auto;field-sizing:content;transition:border-color .3s}
.mt-w textarea:hover{border-color:rgb(250 250 248 / .4)}.mt-w textarea:focus{border-color:var(--bg)}.mt-w [aria-invalid]{border-color:#FF9C93}
.mt-w textarea::placeholder{color:rgb(250 250 248 / .5)}
.mt-w .a{width:100%;font-size:max(1.5rem,7.2cqw);font-weight:700;letter-spacing:-.05em;line-height:1.04}
.mt-w .b{margin-top:1.4cqw;font-size:max(.9375rem,1.75cqw);line-height:1.45}
.mt .up{background:rgb(18 18 20 / .6)}.mt .up i{background:conic-gradient(var(--bg) calc(var(--u,0) * 1%),rgb(250 250 248 / .25) 0)}
.mt-c{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 28px;margin:12px 0 clamp(3rem,5vw,5.5rem)}
.mt-c .chips{grid-template-columns:repeat(4,auto);column-gap:28px;font-size:var(--fs-small)}.mt-c .chips label span{min-height:44px}
@media (max-width:620px){.mt-c .chips{grid-template-columns:repeat(2,1fr);width:100%}}
.mt-k{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;font-weight:600}
.mt-k span{color:var(--mute);font-weight:500}

/* Messages */
.ms>li{padding:clamp(1.5rem,2.6vw,2.75rem) 0;border-bottom:1px solid var(--line)}
.ms{border-top:1px solid var(--line)}
.ms h2{font-size:var(--fs-row);font-weight:600;letter-spacing:-.034em;line-height:1.15;display:flex;align-items:baseline;gap:.45em}
.ms .new h2::after{content:"";width:.34em;aspect-ratio:1;border-radius:50%;background:var(--klein)}
.ms .who{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:6px;font-size:var(--fs-small);color:var(--mute)}
.ms .who a{color:var(--ink);font-weight:600}.ms .who a:hover{color:var(--klein)}
.ms .txt{white-space:pre-wrap;max-width:62ch;margin:clamp(1rem,1.6vw,1.6rem) 0;overflow-wrap:anywhere}

/* Categories */
.ct>li{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 7.5em auto;align-items:end;gap:0 var(--gut);padding:14px 0 18px;border-bottom:1px solid var(--line);background:var(--bg)}
.ct{border-top:1px solid var(--line)}
.ct .grip{margin:0 0 4px -12px}
.ct .n{font-size:var(--fs-small);color:var(--mute);padding-bottom:16px}
.ed-p .fr5{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;font-size:var(--fs-small);margin-top:22px}.ed-p .fr5 label span{min-height:40px}
.lk{border-top:1px solid var(--line);margin-top:18px}
.lk>li{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;align-items:end;gap:0 var(--gut);padding:10px 0 16px;border-bottom:1px solid var(--line)}
.lk .tx{padding-bottom:12px}
@media (max-width:620px){.lk>li{grid-template-columns:minmax(0,1fr) auto}.lk>li>:nth-child(2){grid-column:1}.lk>li>:last-child{grid-column:2;grid-row:1}}

/* Question, message, draft */
.ask{position:fixed;inset:auto 0 0;width:100%;max-width:none;margin:0;border:0;padding:clamp(2rem,4vw,4rem) var(--edge);background:var(--bg);color:var(--ink);translate:0 100%;transition:translate .7s var(--ease-io),overlay .7s allow-discrete,display .7s allow-discrete}
.ask[open]{translate:0 0}
@starting-style{.ask[open]{translate:0 100%}}
.ask::backdrop{background:rgb(18 18 20 / 0);transition:background .6s,overlay .6s allow-discrete,display .6s allow-discrete}
.ask[open]::backdrop{background:rgb(18 18 20 / .4)}
@starting-style{.ask[open]::backdrop{background:rgb(18 18 20 / 0)}}
.ask p+p{margin-top:14px;max-width:48ch;color:var(--mute)}
.ask-a{display:flex;flex-wrap:wrap;align-items:center;gap:14px 32px;margin-top:clamp(1.75rem,3vw,3rem)}
.ts{position:fixed;left:50%;bottom:max(clamp(16px,2.6vw,36px),env(safe-area-inset-bottom));z-index:90;translate:-50% 0;width:max-content;max-width:calc(100vw - 40px);pointer-events:none}
.ts p{display:flex;align-items:center;gap:12px;min-height:54px;padding:12px 28px;border-radius:27px;background:var(--ink);color:var(--bg);font-size:var(--fs-small);font-weight:600;line-height:1.35;white-space:pre-line;animation:rise .7s var(--ease) both}
.ts p::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--bg)}
.ts .err{background:var(--red)}
@keyframes rise{from{translate:0 30px;opacity:0}}
.df{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;margin-bottom:clamp(1.5rem,3vw,3rem);padding:16px 0;border-top:1px solid var(--klein);border-bottom:1px solid var(--klein);font-size:var(--fs-small)}
.df p{margin-right:auto;font-weight:600}

@media (max-width:1080px){.ed-p{grid-column:1/5}.ed-f{grid-column:5/-1}.ef{grid-template-columns:1fr}}
@media (max-width:820px){
  .ab-un{display:none}
  .ad{display:block;padding-top:0}
  .aw{position:sticky;top:var(--hdr);z-index:50;margin:0 calc(var(--edge) * -1) 24px;background:var(--bg);box-shadow:0 1px 0 var(--line);overflow-x:auto;scrollbar-width:none}
  .aw ol{display:flex;gap:22px;padding:0 var(--edge);width:max-content}
  .aw-l,.aw-d,.aw-x{display:none}
  .aw a[aria-current]::after{content:"";width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--klein)}
  .m9{display:block}.ed-p{max-width:340px;margin-bottom:36px}
  .rw>li{flex-wrap:wrap}.rw-o{flex-basis:calc(100% - 60px)}
  .rw .tg{margin:-10px 0 6px 40px}.rw>li>.rw-o:last-child:not(:nth-child(2)){display:none}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mt{aspect-ratio:4/5}.mt-w textarea{width:100%}
  .ct>li{grid-template-columns:40px minmax(0,1fr) auto;row-gap:10px}.ct>li>:nth-child(3){grid-column:2}.ct .n{grid-column:2;padding:0}.ct>li>:last-child{grid-column:3;grid-row:1}
  .lg-mono{margin-top:24px}
}
@media (max-width:560px){.f-two{grid-template-columns:1fr}.ab-st span{display:none}}
</style>
</head>
<body>
<!-- Password -->
<div class="lg" id="login" hidden>
  <header class="lg-top"><a class="lg-mark" href="/" aria-label="moyo, retour au site" translate="no">moyo</a></header>
  <main class="g lg-g">
    <div class="h1"><h1 class="t-xl" id="lgT" tabindex="-1"><span></span><i class="dot">&#8288;<b></b></i></h1><p class="t-lead lg-p" id="lgP"></p></div>
    <form class="lg-f h2" id="lgF" novalidate></form>
  </main>
  <div class="mono-wrap lg-mono" aria-hidden="true" translate="no"><div class="monument" id="look"><span class="bl">m</span><span class="bl eye">o<i class="pu"></i><i class="ld"></i></span><span class="bl">y</span><span class="bl eye">o<i class="pu"></i><i class="ld"></i></span></div></div>
</div>

<!-- App -->
<div id="app" hidden>
  <header class="ab" id="ab">
    <a class="ab-mark" href="/" target="_blank" rel="noopener" aria-label="moyo, voir le site" translate="no">moyo</a>
    <p class="ab-st" id="status" role="status"><i aria-hidden="true"></i><span></span></p>
    <button class="tx ab-un" id="revert" type="button" hidden>Annuler les modifications</button>
    <button class="btn" id="save" type="button" disabled><span>Publier</span><i class="ar" aria-hidden="true"></i></button>
  </header>
  <div class="ad">
    <nav class="aw" aria-label="Sections"><ol id="way"></ol>
      <div class="aw-x"><a class="tx" href="/" target="_blank" rel="noopener">Voir le site ↗</a><button class="tx" id="out" type="button">Se déconnecter</button></div>
    </nav>
    <main class="av" id="view"></main>
