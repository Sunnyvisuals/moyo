<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Admin · Moyo Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5F4F0'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23002FA7'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Hanken Grotesk";src:url(/fonts/hanken-grotesk.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --bg:#F5F4F0;--ink:#121214;--klein:#002FA7;--white:#fff;
  --soft:#5E5E66;
  --line:color-mix(in oklab,var(--ink) 16%,var(--bg));
  --wash:color-mix(in oklab,var(--klein) 7%,var(--bg));
  --danger:#B42318;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --m:clamp(16px,2.4vw,40px);
  --fs-small:.875rem;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--klein);outline-offset:2px}
[hidden]{display:none!important}
.small{font-size:var(--fs-small)}
.muted{color:var(--soft)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border:1px solid var(--ink);background:transparent;font-size:var(--fs-small);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--klein);border-color:var(--klein);color:var(--bg)}
.btn.primary:hover{background:color-mix(in oklab,var(--klein) 86%,#000)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:color-mix(in oklab,var(--danger) 8%,var(--bg))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px 10px}
.icon{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);background:var(--white);font-size:.95rem;line-height:1}
.icon:hover{border-color:var(--ink)}
.icon:disabled{opacity:.35;cursor:not-allowed}

/* Login */
.login{min-height:100svh;display:grid;place-items:center;padding:var(--m)}
.login form{width:min(380px,100%);display:grid;gap:16px}
.login h1{font-size:2.25rem;font-weight:700;letter-spacing:-.04em;line-height:1.05}

/* Fields */
label{display:block;font-size:var(--fs-small);font-weight:600;margin-bottom:4px}
input[type=text],input[type=url],input[type=password],input:not([type]),select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);background:var(--white);border-radius:0}
input:focus,select:focus,textarea:focus{border-color:var(--klein);outline:none;box-shadow:0 0 0 1px var(--klein)}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.check{display:flex;align-items:center;gap:10px;font-weight:500;font-size:1rem;margin:0}
.check input{width:20px;height:20px;accent-color:var(--klein)}
.hint{font-size:.8125rem;color:var(--soft);margin-top:4px}
.count{float:right;font-weight:400;color:var(--soft)}
.count.over{color:var(--danger)}

/* App layout */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px var(--m);background:var(--ink);color:var(--bg)}
.appbar .brand{font-weight:700;letter-spacing:-.03em;margin-right:auto}
.appbar .brand span{font-weight:400;opacity:.7}
.appbar .btn{border-color:var(--bg);color:var(--bg)}
.appbar .btn:hover{background:rgb(255 255 255 / .1)}
.appbar .btn.primary{background:var(--klein);border-color:var(--klein)}
.appbar :focus-visible{outline-color:var(--bg)}
.status{font-size:var(--fs-small);opacity:.9}
.status.todo::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#FFB020}
.layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:var(--m);padding:var(--m);max-width:1400px;margin:0 auto;align-items:start}
.side{position:sticky;top:76px;display:grid;gap:12px}
.side-head{display:flex;gap:8px;flex-wrap:wrap}
.plist{border:1px solid var(--line);background:var(--white);max-height:calc(100svh - 260px);overflow:auto}
.plist li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:6px 6px 6px 0}
.plist li:last-child{border-bottom:0}
.plist li.on{background:var(--wash);box-shadow:inset 3px 0 0 var(--klein)}
.plist .pick{flex:1;min-width:0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 10px;align-items:center;text-align:left;background:none;border:0;padding:4px 0 4px 10px}
.plist .thumb{grid-row:span 2;width:44px;height:55px;position:relative;overflow:hidden;background:var(--wash)}
.plist .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.plist .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .s{font-size:.75rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .star{color:var(--klein)}
.plist .mv{display:flex;flex-direction:column;gap:2px}
.plist .mv .icon{width:26px;height:22px;font-size:.7rem}

.panel{background:var(--white);border:1px solid var(--line);padding:clamp(16px,2.4vw,32px)}
.panel h2{font-size:1.75rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:4px}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.section{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.section>h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lang{display:inline-block;font-size:.6875rem;font-weight:700;letter-spacing:.06em;padding:1px 5px;margin-right:6px;background:var(--wash);vertical-align:1px}
.req::after{content:" *";color:var(--danger)}

/* Pictures */
.cover{display:grid;grid-template-columns:minmax(0,280px) 1fr;gap:20px;align-items:start}
.preview{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--wash)}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.none::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:var(--klein)}
.preview.pickable{cursor:crosshair}
.preview .fx{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgb(0 0 0 / .45),inset 0 0 0 1px rgb(0 0 0 / .45);pointer-events:none}
.cover .actions{display:grid;gap:10px;justify-items:start}
.crops{display:flex;gap:10px;align-items:end}
.crops span{position:relative;display:block;overflow:hidden;background:var(--wash);border:1px solid var(--line)}
.crops img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.crops small{display:block;font-size:.6875rem;color:var(--soft);margin-top:2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gallery li{border:1px solid var(--line);background:var(--bg)}
.gallery img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.gallery .bar{display:flex;justify-content:space-between;padding:4px;gap:4px}
.drop{border:1px dashed var(--soft);padding:18px;text-align:center;color:var(--soft);font-size:var(--fs-small)}
.drop.over{background:var(--wash);border-color:var(--klein);color:var(--klein)}
.busy{font-size:var(--fs-small);color:var(--soft)}

/* Categories */
.cats li{display:grid;grid-template-columns:150px 1fr 1fr auto;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.cats .n{font-size:.75rem;color:var(--soft);padding-bottom:10px;white-space:nowrap}

.msgs li{padding:20px 0;border-bottom:1px solid var(--line)}
.msgs .mh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:8px}
.msgs .mn{font-weight:700}
.msgs .mm{white-space:pre-wrap;max-width:70ch;margin:10px 0 12px}
.msgs .tags{display:flex;gap:6px;flex-wrap:wrap}
.msgs .tag{font-size:.75rem;padding:2px 8px;background:var(--wash)}
.subs li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--fs-small)}
.danger-zone{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.guide{background:var(--wash);border:1px solid var(--line);padding:16px 18px;font-size:var(--fs-small)}
.guide h3{font-size:1rem;margin-bottom:6px}
.guide ol{list-style:decimal;padding-left:20px;display:grid;gap:6px;margin-top:6px}
.guide+.guide{margin-top:12px}
.toast{position:fixed;left:50%;bottom:20px;translate:-50% 0;z-index:50;max-width:min(560px,calc(100vw - 32px));padding:12px 18px;background:var(--ink);color:var(--bg);font-size:var(--fs-small);white-space:pre-line;box-shadow:0 8px 30px rgb(0 0 0 / .25)}
.toast.err{background:var(--danger)}
.empty-state{padding:48px 0;text-align:center;color:var(--soft)}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .plist{max-height:320px}
  .grid2,.grid3,.cover{grid-template-columns:1fr}
  .cats li{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- Login -->
<section class="login" id="loginView" hidden>
  <form id="loginForm">
    <h1>moyo<br><span class="muted">administration</span></h1>
    <p class="small muted" id="loginNote">Entrez le mot de passe du studio pour modifier les projets et l’équipe.</p>
    <div>
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" type="submit" id="loginBtn">Se connecter</button>
    <p class="small" role="alert" id="loginErr" style="color:var(--danger)"></p>
    <a class="small" href="/">← Retour au site</a>
  </form>
</section>

<!-- App -->
<div id="appView" hidden>
  <header class="appbar">
    <p class="brand">moyo <span>· admin</span></p>
    <span class="status" id="status" aria-live="polite"></span>
    <button class="btn primary" type="button" id="saveBtn" disabled>Enregistrer et publier</button>
    <a class="btn" href="/" target="_blank" rel="noopener">Voir le site ↗</a>
    <button class="btn" type="button" id="logoutBtn">Déconnexion</button>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="side-head">
        <button class="btn primary" type="button" id="addBtn">+ Nouveau projet</button>
        <button class="btn" type="button" id="teamBtn">Équipe</button>
        <button class="btn" type="button" id="catsBtn">Catégories</button>
        <button class="btn" type="button" id="msgsBtn">Messages <span id="msgCount" class="muted"></span></button>
        <button class="btn" type="button" id="helpBtn">Guide</button>
      </div>
      <ol class="plist" id="plist" aria-label="Projets"></ol>
      <p class="small muted">★ = affiché sur l’accueil. L’ordre de la liste est l’ordre du site (flèches ▲ ▼).</p>
    </aside>

    <main id="editor" class="panel"></main>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H={'X-Moyo-Admin':'1'};
const src=id=>id&&id[0]==='/'?id:'/img/'+encodeURIComponent(id); // the example pictures are files of the site (/proj/…)
const fstyle=f=>f?` style="object-position:${esc(f)}"`:'';
const E=$('#editor');

let data=null;        // working copy
let savedJSON='';     // last published version, to know if something changed
let savedImages=new Set();
let sel=null;         // selected project id, or '__team', '__cats', '__msgs', '__help'

/* ---------- helpers ---------- */
let toastT;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.classList.toggle('err',!!err);t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,err?7000:3200)}
async function api(path,opt={}){
  const res=await fetch(path,{credentials:'same-origin',...opt,headers:{...H,...(opt.headers||{})}});
  let body=null; try{body=await res.json()}catch(e){}
  if(res.status===401&&path!=='/api/login'){showLogin('Session expirée, reconnectez-vous. Vos modifications non publiées sont perdues.');throw new Error('401')}
  if(!res.ok) throw new Error(body?.message||('Erreur '+res.status));
  return body;
}
const slugify=(s,fb='projet')=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||fb;
function uniqueId(base,except){let id=base,n=2;while(data.projects.some(p=>p.id===id&&p!==except)) id=(base.slice(0,56)+'-'+n++);return id}
function uniqueTeamId(base,except){let id=base,n=2;while(data.team.some(m=>m.id===id&&m!==except)) id=(base.slice(0,56)+'-'+n++);return id}
const imagesOf=d=>{const s=new Set();for(const p of d.projects){if(p.cover)s.add(p.cover);(p.images||[]).forEach(i=>s.add(i))}for(const m of d.team||[]) if(m.photo) s.add(m.photo);return s};
const dirty=()=>JSON.stringify(data)!==savedJSON;
function refreshDirty(){const d=dirty();$('#saveBtn').disabled=!d;const st=$('#status');st.textContent=d?'Modifications non publiées':'Tout est publié';st.classList.toggle('todo',d)}
const catName=id=>data.categories.find(c=>c.id===id)?.fr||'Sans catégorie';
const go=s=>{sel=s;renderList();renderEditor();scrollTo({top:0})};

function field(id,label,val,{req,area,hint,lang,ph,max,type='text'}={}){
  const l=lang?`<span class="lang">${lang}</span>`:'';
  const p=ph?` placeholder="${esc(ph)}"`:'';
  const input=area?`<textarea id="${id}"${p}>${esc(val)}</textarea>`:`<input type="${type}" id="${id}" value="${esc(val)}"${req?' required':''}${p}>`;
  const c=max?`<span class="count" data-for="${id}" data-max="${max}"></span>`:'';
  return `<div><label for="${id}" class="${req?'req':''}">${c}${l}${label}</label>${input}${hint?`<p class="hint">${hint}</p>`:''}</div>`;
}
/* a length counter next to a label (e.g. how much of a description Google shows) */
function counts(){$$('.count',E).forEach(c=>{const f=document.getElementById(c.dataset.for);if(!f)return;const n=f.value.length,m=+c.dataset.max;c.textContent=n+' / '+m;c.classList.toggle('over',n>m)})}

/* ---------- pictures: preview, focal point, crops ---------- */
/* A click on the picture says where it stays centred when the site crops it (cards, sheet, profile, shares). */
function picture(img,focus,ratio='4/5'){
  if(!img) return `<div class="preview none" style="aspect-ratio:${ratio}" aria-hidden="true"></div>`;
  const [x,y]=(focus||'50% 50%').split(' ');
  return `<div class="preview pickable" data-act="focus" style="aspect-ratio:${ratio}" title="Cliquez sur le sujet de la photo pour le garder visible">
    <img src="${src(img)}" alt=""${fstyle(focus)}><span class="fx" style="left:${esc(x)};top:${esc(y)}"></span></div>
    <p class="hint">Cliquez sur le sujet de la photo (un visage, un objet) : il restera visible quel que soit le format.</p>
    <div class="crops" aria-label="Aperçu des recadrages">${[['Carte','4/5',48],['Partage','1.9/1',96],['Carré','1/1',60]].map(([n,r,w])=>`<div><span style="width:${w}px;aspect-ratio:${r}"><img src="${src(img)}" alt=""${fstyle(focus)}></span><small>${n}</small></div>`).join('')}</div>`;
}
function focusAt(e,box){const r=box.getBoundingClientRect();const k=v=>Math.round(Math.min(100,Math.max(0,v*100)));return k((e.clientX-r.left)/r.width)+'% '+k((e.clientY-r.top)/r.height)+'%'}

/* ---------- views ---------- */
function showLogin(note){
  $('#appView').hidden=true; $('#loginView').hidden=false;
  if(note) $('#loginNote').textContent=note;
  $('#pw').value=''; $('#pw').focus();
}
async function showApp(){
  $('#loginView').hidden=true; $('#appView').hidden=false;
  const d=await api('/api/projects');
  d.team||=[];
  data=d; savedJSON=JSON.stringify(d); savedImages=imagesOf(d);
  let seen=false; try{seen=localStorage.getItem('moyo-guide')==='1'}catch(e){}
  sel=seen?(data.projects[0]?.id||null):'__help';
  renderList(); renderEditor(); refreshDirty(); loadMsgs();
}

function renderList(){
  const L=$('#plist');
  if(!data.projects.length){L.innerHTML='<li class="empty-state" style="display:block;padding:24px">Aucun projet. Cliquez sur « + Nouveau projet ».</li>';return}
  L.innerHTML=data.projects.map((p,i)=>`<li class="${p.id===sel?'on':''}" data-id="${esc(p.id)}">
    <button type="button" class="pick" data-act="pick" aria-current="${p.id===sel}">
      <span class="thumb${p.cover?'':' none'}" aria-hidden="true">${p.cover?`<img src="${src(p.cover)}" alt=""${fstyle(p.focus)}>`:''}</span>
      <span class="t">${p.featured?'<span class="star" title="Sur l’accueil">★ </span>':''}${esc(p.fr.title||'(sans titre)')}</span>
      <span class="s">${esc([p.year,catName(p.category)].filter(Boolean).join(' · '))}</span>
    </button>
    <span class="mv"><button type="button" class="icon" data-act="up" aria-label="Monter ${esc(p.fr.title)}" ${i===0?'disabled':''}>▲</button><button type="button" class="icon" data-act="down" aria-label="Descendre ${esc(p.fr.title)}" ${i===data.projects.length-1?'disabled':''}>▼</button></span>
  </li>`).join('');
}
$('#plist').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const id=b.closest('li').dataset.id, i=data.projects.findIndex(p=>p.id===id);
  if(b.dataset.act==='pick'){sel=id;renderList();renderEditor();if(matchMedia('(max-width:860px)').matches)E.scrollIntoView({block:'start',behavior:'smooth'});return}
  const j=b.dataset.act==='up'?i-1:i+1; if(j<0||j>=data.projects.length) return;
  [data.projects[i],data.projects[j]]=[data.projects[j],data.projects[i]];
  renderList(); refreshDirty();
  $(`#plist li[data-id="${CSS.escape(id)}"] [data-act="${b.dataset.act}"]`)?.focus();
});

function renderEditor(){
  if(sel==='__cats') return renderCats();
  if(sel==='__msgs') return renderMsgs();
  if(sel==='__team') return renderTeam();
  if(sel==='__help') return renderHelp();
  const p=data.projects.find(p=>p.id===sel);
  if(!p){E.innerHTML='<div class="empty-state"><p>Aucun projet sélectionné.</p><p class="small">Créez un projet avec « + Nouveau projet », ou ouvrez le guide.</p></div>';return}
  const n=(p.images||[]).length, live=JSON.parse(savedJSON).projects.some(x=>x.id===p.id);
  E.innerHTML=`
  <div class="head-row"><div><h2 id="pH">${esc(p.fr.title||'Nouveau projet')}</h2>
  <p class="small muted">Les champs anglais vides reprennent le texte français.</p></div>
  ${live?`<a class="btn sm" href="/projets/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">Voir la page du projet ↗</a>`:'<span class="small muted">Pas encore en ligne</span>'}</div>

  <div class="section"><h3>1. Textes</h3>
    <div class="grid2">
      ${field('fr_title','Titre',p.fr.title,{req:1,lang:'FR',max:70})}${field('en_title','Titre',p.en.title,{lang:'EN',max:70})}
      ${field('fr_desc','Description',p.fr.desc,{area:1,lang:'FR',max:160,hint:'Deux ou trois phrases. Le début (environ 160 caractères) apparaît dans Google et dans les aperçus de partage : commencez par l’essentiel.'})}${field('en_desc','Description',p.en.desc,{area:1,lang:'EN',max:160})}
      ${field('fr_client','Client',p.fr.client,{lang:'FR',ph:'Ex. : Ville de Nice'})}${field('en_client','Client',p.en.client,{lang:'EN'})}
      ${field('fr_type','Type de projet',p.fr.type,{lang:'FR',ph:'Identité et site, Film, Affiche…'})}${field('en_type','Type de projet',p.en.type,{lang:'EN'})}
      ${field('fr_role','Rôle du studio',p.fr.role,{lang:'FR',ph:'Direction artistique, développement'})}${field('en_role','Rôle du studio',p.en.role,{lang:'EN'})}
      ${field('fr_place','Lieu',p.fr.place,{lang:'FR',ph:'Nice'})}${field('en_place','Lieu',p.en.place,{lang:'EN'})}
    </div>
  </div>

  <div class="section"><h3>2. Classement</h3>
    <div class="grid3">
      ${field('year','Année',p.year,{ph:String(new Date().getFullYear())})}
      <div><label for="category">Catégorie</label><select id="category">
        <option value="">Sans catégorie</option>
        ${data.categories.map(c=>`<option value="${esc(c.id)}"${c.id===p.category?' selected':''}>${esc(c.fr)}</option>`).join('')}
      </select><p class="hint"><button type="button" class="btn sm" data-act="cats" style="margin-top:4px">Gérer les catégories</button></p></div>

/* ---------- editor events: delegated once on #editor (its content is redrawn often) ---------- */
const curP=()=>data&&sel&&!sel.startsWith('__')?data.projects.find(p=>p.id===sel):null;
const KEYS=['title','type','role','place','desc','client','alt'];
const member=el=>{const box=el.closest('[data-tm]');return box&&data.team[+box.dataset.tm]};

E.addEventListener('input',e=>{
  const t=e.target; counts();
  if(sel==='__cats'){
    const li=t.closest('#cats li'); if(!li) return;
    const c=data.categories.find(c=>c.id===li.dataset.id); if(!c) return;
    c[t.dataset.k]=t.value; refreshDirty(); renderList(); return;
  }
  if(sel==='__team'){
    const m=member(t), k=t.dataset.k; if(!m||!k||k==='photo') return;
    if(k==='first'||k==='last'){ m[k]=t.value; m.name=`${m.first||''} ${m.last||''}`.trim(); }
    else if(k==='id') return; // on change
    else if(k==='link.label'||k==='link.url'){ const j=+t.closest('[data-ln]').dataset.ln; m.links[j][k.split('.')[1]]=t.value; }
    else { const [lg,f]=k.split('.'); (m[lg]||={})[f]=t.value; }
    refreshDirty(); return;
  }
  const p=curP(); if(!p) return;
  const id=t.id, mt=id.match(/^(fr|en)_(\w+)$/);
  if(mt&&KEYS.includes(mt[2])){ p[mt[1]][mt[2]]=t.value; if(id==='fr_title'){ $('#pH').textContent=t.value||'Nouveau projet'; renderList(); } }
  else if(id==='year') p.year=t.value;
  else if(id==='link') p.link=t.value.trim();
  else if(id==='category'){ p.category=t.value; renderList(); }
  else if(id==='featured'){ p.featured=t.checked; renderList(); }
  else return;
  refreshDirty();
});
E.addEventListener('change',async e=>{
  const t=e.target;
  if(sel==='__team'){
    const m=member(t); if(!m) return;
    if(t.dataset.k==='id'){ const id=uniqueTeamId(slugify(t.value,'profil'),m); t.value=id; m.id=id; t.nextElementSibling.innerHTML='/equipe/<b>'+esc(id)+'</b>'; refreshDirty(); return; }
    if(t.dataset.k!=='photo') return;
    const f=t.files[0]; if(!f) return;
    const busy=t.closest('[data-tm]').querySelector('[data-busy]'); busy.textContent='Envoi en cours…';
    try{ const id=await upload(f); const old=m.photo; m.photo=id; m.focus=''; dropIfUnsaved(old); renderTeam(); refreshDirty(); toast('Photo ajoutée. Cliquez sur le visage pour le cadrage, puis publiez.'); }
    catch(err){ busy.textContent=''; toast(err.message,true); }
    return;
  }
  const p=curP(); if(!p) return;
  if(t.id==='pid'){ const id=uniqueId(slugify(t.value),p); t.value=id; p.id=id; sel=id; $('#pidH').textContent=id; renderList(); refreshDirty(); }
  else if(t.id==='coverIn'){
    const f=t.files[0]; if(!f) return;
    $('#coverBusy').textContent='Envoi en cours…';
    try{ const id=await upload(f); const old=p.cover; p.cover=id; p.focus=''; dropIfUnsaved(old); if(curP()===p) renderEditor(); renderList(); refreshDirty(); toast('Photo ajoutée. Cliquez sur le sujet pour le cadrage, puis publiez.'); }
    catch(err){ if($('#coverBusy')) $('#coverBusy').textContent=''; toast(err.message,true); }
  }
  else if(t.id==='galIn') addFiles(p,t.files);
});
E.addEventListener('dragover',e=>{const d=e.target.closest('#drop'); if(d){e.preventDefault();d.classList.add('over')}});
E.addEventListener('dragleave',e=>{e.target.closest('#drop')?.classList.remove('over')});
E.addEventListener('drop',e=>{const d=e.target.closest('#drop'); if(!d) return; e.preventDefault(); d.classList.remove('over'); const p=curP(); if(p) addFiles(p,e.dataTransfer.files)});
async function addFiles(p,files){
  files=[...files].filter(f=>f.type.startsWith('image/')); if(!files.length) return;
  let ok=0;
  for(const [k,f] of files.entries()){
    if($('#galBusy')) $('#galBusy').textContent=`Envoi ${k+1} / ${files.length}…`;
    try{ const id=await upload(f); (p.images||=[]).push(id); ok++; }catch(err){ toast(f.name+' : '+err.message,true); }
  }
  if(curP()===p) renderEditor(); refreshDirty(); if(ok) toast(`${ok} image${ok>1?'s':''} ajoutée${ok>1?'s':''}. Pensez à publier.`);
}
E.addEventListener('submit',e=>{
  if(e.target.id!=='catAdd') return;
  e.preventDefault();
  const fr=$('#newFr').value.trim(); if(!fr) return;
  let id=slugify(fr,'categorie'), n=2; const base=id; while(data.categories.some(c=>c.id===id)) id=base+'-'+n++;
  data.categories.push({id,fr,en:$('#newEn').value.trim()||fr});
  renderCats(); refreshDirty(); $('#newFr').focus();
});
E.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='cats') return go('__cats');
  if(act==='back') return go(data.projects[0]?.id||null);
  if(act==='rm'){ const id=b.closest('li').dataset.id; data.categories=data.categories.filter(c=>c.id!==id); renderCats(); refreshDirty(); return; }
  if(act==='csv'){
    const rows=[['email','langue','date'],...subs.map(s=>[s.email,s.lang||'fr',s.at||''])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+rows],{type:'text/csv'})); a.download='moyo-inscriptions.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); return;
  }
  if(act==='rmMsg'){
    const li=b.closest('li'); if(!confirm('Supprimer ce message ? Il ne pourra pas être récupéré.')) return;
    api('/api/messages/'+encodeURIComponent(li.dataset.id),{method:'DELETE'}).then(()=>{li.remove();toast('Message supprimé.');loadMsgs()}).catch(err=>toast(err.message,true));
    return;
  }
  if(sel==='__team'){
    const box=b.closest('[data-tm]'), i=box?+box.dataset.tm:-1, m=box&&data.team[i];
    switch(act){
      case 'focus': m.focus=focusAt(e,b); break;
      case 'tmAdd': data.team.push({id:uniqueTeamId('profil'),name:'',first:'',last:'',photo:null,focus:'',fr:{role:'',bio:''},en:{role:'',bio:''},links:[]}); break;
      case 'tmDel': if(!confirm(`Retirer « ${m.name||m.id} » de l’équipe ? Sa page disparaîtra à la prochaine publication.`)) return; data.team.splice(i,1); dropIfUnsaved(m.photo); break;
      case 'tmUp': case 'tmDown': { const j=act==='tmUp'?i-1:i+1; if(j<0||j>=data.team.length) return; [data.team[i],data.team[j]]=[data.team[j],data.team[i]]; break; }
      case 'tmPhotoRm': { const old=m.photo; m.photo=null; m.focus=''; dropIfUnsaved(old); break; }
      case 'lnAdd': (m.links||=[]).push({label:'',url:''}); break;
      case 'lnDel': m.links.splice(+b.closest('[data-ln]').dataset.ln,1); break;
      default: return;
    }
    const y=scrollY; renderTeam(); refreshDirty(); scrollTo({top:y});
    if(act==='tmAdd') $$('[data-tm]').pop()?.querySelector('[data-k="first"]')?.focus();
    return;
  }
  const p=curP(); if(!p) return;
  if(act==='focus'){ p.focus=focusAt(e,b); const y=scrollY; renderEditor(); renderList(); refreshDirty(); scrollTo({top:y}); return; }
  if(act==='rmCover'){ const old=p.cover; p.cover=null; p.focus=''; dropIfUnsaved(old); renderEditor(); renderList(); refreshDirty(); return; }
  if(act==='delete'){
    if(!confirm(`Supprimer « ${p.fr.title||p.id} » ? Le projet disparaîtra du site à la prochaine publication.`)) return;
    const i=data.projects.indexOf(p); data.projects.splice(i,1);
    [p.cover,...(p.images||[])].forEach(dropIfUnsaved);
    sel=data.projects[Math.min(i,data.projects.length-1)]?.id||null; renderList(); renderEditor(); refreshDirty(); return;
  }
  const li=b.closest('[data-img]'); if(!li) return;
  const i=p.images.indexOf(li.dataset.img);
  if(act==='gx'){ const [old]=p.images.splice(i,1); dropIfUnsaved(old); }
  else if(act==='gc'){ const [img]=p.images.splice(i,1); if(p.cover) p.images.unshift(p.cover); p.cover=img; p.focus=''; renderList(); toast('Photo principale changée. L’ancienne est dans la galerie.'); }
  else { const j=act==='gl'?i-1:i+1; [p.images[i],p.images[j]]=[p.images[j],p.images[i]]; }
  const y=scrollY; renderEditor(); refreshDirty(); scrollTo({top:y});
});

/* Uploaded but never published, then removed: delete it from storage now. */
function dropIfUnsaved(id){
  if(!id||id[0]==='/'||savedImages.has(id)||imagesOf(data).has(id)) return;
  api('/api/images/'+encodeURIComponent(id),{method:'DELETE'}).catch(()=>{});
}

/* Resize in the browser before upload: long side 2400 px, WebP (JPEG if WebP is not available). GIFs are sent as is. */
async function upload(file){
  let blob=file;
  if(file.type!=='image/gif'){
    try{
      const bmp=await createImageBitmap(file);
      const s=Math.min(1,2400/Math.max(bmp.width,bmp.height));
      const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      blob=await new Promise(r=>c.toBlob(r,'image/webp',.86));
      if(!blob||blob.type!=='image/webp') blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));
    }catch(e){ blob=file; }
  }
  if(!/^image\/(webp|jpeg|png|avif|gif)$/.test(blob.type)) throw new Error('Format non reconnu. Exportez la photo en JPEG ou PNG.');
  if(blob.size>10*1024*1024) throw new Error('Image trop lourde (10 Mo maximum).');
  const r=await api('/api/images',{method:'POST',headers:{'Content-Type':blob.type},body:blob});
  return r.id;
}

/* ---------- top-level actions ---------- */
$('#addBtn').addEventListener('click',()=>{
  const id=uniqueId('nouveau-projet');
  const p={id,year:String(new Date().getFullYear()),category:'',featured:false,cover:null,focus:'',images:[],link:'',
    fr:{title:'',type:'',role:'',place:'',desc:'',client:'',alt:''},en:{title:'',type:'',role:'',place:'',desc:'',client:'',alt:''}};
  data.projects.unshift(p); go(id); refreshDirty();
  const t=$('#fr_title'); t.focus();
  t.addEventListener('change',()=>{ if(p.id.startsWith('nouveau-projet')&&t.value){ p.id=uniqueId(slugify(t.value),p); sel=p.id; $('#pid').value=p.id; $('#pidH').textContent=p.id; renderList(); refreshDirty(); } },{once:true});
});
$('#catsBtn').addEventListener('click',()=>go('__cats'));
$('#teamBtn').addEventListener('click',()=>go('__team'));
$('#msgsBtn').addEventListener('click',()=>go('__msgs'));
$('#helpBtn').addEventListener('click',()=>go('__help'));

$('#saveBtn').addEventListener('click',async()=>{
  const missing=data.projects.find(p=>!p.fr.title.trim());
  if(missing){ go(missing.id); $('#fr_title').focus(); toast('Chaque projet doit avoir un titre en français.',true); return; }
  const noName=data.team.find(m=>!m.name.trim());
  if(noName){ go('__team'); toast('Chaque personne de l’équipe doit avoir un prénom ou un nom.',true); return; }
  const badLink=data.team.flatMap(m=>m.links||[]).find(l=>l.url&&!/^(https?:\/\/|mailto:)/i.test(l.url.trim()));
  if(badLink){ go('__team'); toast(`Le lien « ${badLink.url} » doit commencer par https:// (ou mailto: pour un e-mail).`,true); return; }
  const b=$('#saveBtn'); b.disabled=true; $('#status').textContent='Publication…';
  try{
    const r=await api('/api/projects',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    data=r.data; data.team||=[]; savedJSON=JSON.stringify(data); savedImages=imagesOf(data);
    if(sel&&!sel.startsWith('__')&&!data.projects.some(p=>p.id===sel)) sel=data.projects[0]?.id||null;
    renderList(); renderEditor(); refreshDirty();
    toast('Publié. Le site est à jour.');
  }catch(err){ refreshDirty(); if(err.message!=='401') toast(err.message,true); }
});

$('#logoutBtn').addEventListener('click',async()=>{
  if(dirty()&&!confirm('Des modifications ne sont pas publiées. Se déconnecter quand même ?')) return;
  await api('/api/logout',{method:'POST'}).catch(()=>{});
  data=null; savedJSON=''; showLogin('Vous êtes déconnecté.');
});
addEventListener('beforeunload',e=>{ if(data&&dirty()){ e.preventDefault(); e.returnValue=''; } });
addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'&&data){ e.preventDefault(); if(!$('#saveBtn').disabled) $('#saveBtn').click(); } });

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=$('#loginBtn'); b.disabled=true; $('#loginErr').textContent='';
  try{ await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})}); await showApp(); }
  catch(err){ $('#loginErr').textContent=err.message; }
  finally{ b.disabled=false; }
});

/* ---------- start ---------- */
(async()=>{
  try{
    const me=await api('/api/me');
    if(!me.configured){ showLogin(); $('#loginForm').innerHTML='<h1>moyo<br><span class="muted">administration</span></h1><p>Le mot de passe admin n’est pas encore défini. Ajoutez la variable secrète <b>ADMIN_PASSWORD</b> au projet Cloudflare Pages, puis redéployez.</p>'; return; }
    if(me.admin) await showApp(); else showLogin();
  }catch(err){ if(err.message!=='401'){ showLogin(); $('#loginErr').textContent='Le serveur ne répond pas ('+err.message+').'; } }
})();
})();
</script>
