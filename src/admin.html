<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAFAF8">
<title>Admin · Moyo Studio</title>
__ICONS__
<link rel="preload" href="/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
__CSS__
/* ---------- Admin: the same system as the site (shared/design.js), the same axes, the same dot. Behaviour: admin.js ---------- */
:root{--max:clamp(1480px,62vw,2000px);--red:#B3261E}
html{scroll-padding-top:calc(var(--hdr) + 24px)}
body{min-height:100vh;min-height:100svh}
.lg-mark,.ab-mark{display:inline-flex;align-items:center;min-height:44px;font-size:clamp(1.5rem,calc(var(--t) * .0204),2.25rem);font-weight:700;letter-spacing:-.052em;line-height:1;margin-left:-.06em}
.tx{display:inline-flex;align-items:center;gap:.4em;min-height:40px;font-size:var(--fs-small);font-weight:600;transition:color .3s}
.tx:hover{color:var(--klein)}.tx.red:hover{color:var(--red)}.tx:disabled{opacity:.4;pointer-events:none}
.btn.red{--c:var(--red)}
.btn:disabled{opacity:.3;cursor:default}

/* Password: the wordmark looks at you, and shuts its eyes while you write */
.lg{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:clip}
.lg-top{height:var(--hdr);padding:0 var(--edge);display:flex;align-items:center;flex:none}
.lg-g{flex:1 0 auto;padding:clamp(1.5rem,6vh,5rem) var(--edge) clamp(2rem,6vh,5rem);align-items:start;row-gap:clamp(2rem,5vw,4rem)}
.lg h1{font-size:clamp(2.75rem,calc(var(--t) * .074),9.5rem);outline:none}
.lg-p{max-width:32ch;margin-top:clamp(1.5rem,2.4vw,2.5rem);color:var(--mute)}
.lg-f{display:grid;gap:clamp(1.75rem,2.6vw,2.75rem);padding-top:clamp(0rem,.6vw,.75rem)}
.lg-a{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px}
.lg-n{font-size:var(--fs-small);color:var(--mute);max-width:46ch}
.lg-mono{flex:none;margin:0 var(--edge)}
.pwd{position:relative}
.pwd input{padding-right:6.2em!important}
.pwd .tx{position:absolute;right:0;bottom:6px}
.str{display:flex;align-items:center;gap:14px;font-size:var(--fs-small);color:var(--mute);margin-top:14px}
.str .f-dots{margin:0}

/* Bar */
.ab{position:sticky;top:0;z-index:60;height:var(--hdr);padding:0 var(--edge);display:flex;align-items:center;gap:clamp(14px,2vw,36px);background:var(--bg);box-shadow:0 1px 0 rgb(18 18 20 / 0);transition:box-shadow .4s}
.ab.on{box-shadow:0 1px 0 var(--line)}
.ab-mark{margin-right:auto}
.ab{user-select:none;-webkit-user-select:none}
.ab-st{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-small);font-weight:500;color:var(--mute);transition:color .4s}
.ab-st i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgb(18 18 20 / .35);transition:background .4s,box-shadow .4s}
.ab-st.dirty{color:var(--ink)}.ab-st.dirty i{background:var(--klein);box-shadow:none}
.ab-st.busy i{animation:busy 1s var(--ease-io) infinite;background:var(--klein);box-shadow:none}
.ab .btn{font-size:var(--fs-body)}

/* The way, always open here: a line, a dot, the names */
.ad{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);align-items:start;padding:clamp(1rem,2.4vw,2.75rem) var(--edge) clamp(7rem,12vw,12rem)}
.aw{--row:clamp(42px,calc(var(--w) * .029),56px);grid-column:1/4;position:sticky;top:calc(var(--hdr) + clamp(1rem,2.4vw,2.75rem))}
.aw ol{position:relative;padding-left:28px}
.aw-l{position:absolute;left:5px;top:calc(var(--row) / 2);bottom:calc(var(--row) / 2);width:1px;background:rgb(18 18 20 / .2)}
.aw-d{position:absolute;left:0;top:calc(var(--row) / 2 - 5.5px);width:11px;height:11px;border-radius:50%;background:var(--klein);translate:0 calc(var(--peek,var(--at,0)) * var(--row));transition:translate .8s var(--ease)}
.aw a{display:inline-flex;align-items:center;height:var(--row);font-weight:600;color:var(--mute);transition:color .3s}
.aw a[aria-current]{color:var(--ink)}
.aw a:hover{color:var(--klein)}
.aw sup{font-size:.7em;font-weight:500;line-height:0;margin-left:.35em;translate:0 -.1em}
.aw .new sup{color:var(--klein);font-weight:700}
.aw-x{display:grid;justify-items:start;gap:6px;margin-top:clamp(1.5rem,2.6vw,2.75rem);padding-left:28px}
.aw-x .btn{height:auto;color:var(--ink);font-size:var(--fs-small)}
.aw-x a.btn:hover{color:var(--klein)}
@media (hover:hover){#out:hover{--c:var(--red)}}#out:focus-visible{--c:var(--red);color:var(--red)} /* leaving is told in red */ /* in ink, underlined, with their point: they are seen to be pressed */

/* Views */
.av{grid-column:4/-1;min-width:0;outline:none}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 32px;margin-bottom:clamp(2rem,3.8vw,4.25rem)}
.vh h1{outline:none;padding-top:.18em}
.vh .dot b{animation:fall 1.6s linear(0,.0157,.0625,.1406,.25,.3906,.5625,.7656,1 36.4%,.8906 45.5%,.8125 50%,.7656 54.5%,.75 59%,.7656 63.6%,.8125 68.2%,.8906 72.7%,1 77.3%,.9531,.9375 86.4%,.9531,1 95.5%,.9844,1) .15s both}
@keyframes fall{from{translate:0 -1.35em;opacity:0}12%{opacity:1}}
@keyframes words{from{opacity:0;padding-top:44px}}
/* under the mouse, slowly: the picture comes closer, the name moves on */
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  .aw a{transition:color .3s,translate .9s var(--ease)}.aw a:hover{translate:7px 0}
  .rw-o .plate img{transition:scale 1.6s var(--ease)}.rw-o:hover .plate img{scale:1.1}
  .rw-o .rw-t,.rw-o .rw-s{transition:color .4s,translate .9s var(--ease)}.rw-o:hover :is(.rw-t,.rw-s){translate:10px 0}
}
.vn{max-width:54ch;margin:calc(clamp(2rem,3.8vw,4.25rem) * -.45) 0 clamp(2rem,3.8vw,4.25rem);color:var(--mute)}
.vb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 32px;margin-bottom:clamp(.75rem,1.6vw,1.75rem)}
.av .crumbs{margin:0}
.seg{display:inline-flex;gap:20px;font-size:var(--fs-small)}
.seg button{min-height:40px;font-weight:600;color:var(--mute);background:linear-gradient(currentColor,currentColor) 0 calc(100% - 8px)/0 1px no-repeat;transition:background-size .7s var(--ease),color .3s}
.seg button[aria-pressed=true]{color:var(--ink);background-size:100% 1px}
.seg button:hover{color:var(--klein)}
.m9{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));column-gap:var(--gut);row-gap:clamp(2rem,4vw,4rem);align-items:start}
.sct{margin-top:clamp(3.5rem,6vw,6.5rem);border-top:1px solid var(--line);padding-top:clamp(1.25rem,2vw,2rem)}
.sct>h2{font-size:inherit;font-weight:600;margin-bottom:clamp(1.25rem,2vw,2rem)}
/* a part that opens and shuts */
.acc{border-top:1px solid var(--line)}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 24px;padding:clamp(1.25rem,2vw,2rem) 0;list-style:none;cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc h2{font-size:var(--fs-m);font-weight:700;letter-spacing:-.034em;line-height:1.15;transition:color .3s}
.acc-s{grid-column:1;font-size:var(--fs-small);color:var(--mute)}
.acc-go{grid-column:2;grid-row:1/span 2;font-size:var(--fs-small)}
.acc-go .c,.acc[open] .acc-go .o{display:none}.acc[open] .acc-go .c{display:inline}
@media (hover:hover){.acc>summary:hover h2,.acc>summary:hover .acc-go{color:var(--klein)}}
.acc-b{padding:.5rem 0 clamp(2.25rem,3.4vw,3.25rem)}
.acc-b>.vn{margin:0 0 1.75rem}
.acc-b>h3.mt-k{margin:clamp(2.25rem,3.4vw,3.25rem) 0 1.25rem}
.acc-end{margin-top:clamp(1.75rem,2.8vw,2.75rem)}
@media (prefers-reduced-motion:no-preference){
  /* a part opens and shuts slowly, where the browser can */
  .acc{interpolate-size:allow-keywords}
  .acc::details-content{height:0;opacity:0;overflow:clip;overflow-clip-margin:10px;transition:height 1.1s var(--ease),opacity .9s,content-visibility 1.1s allow-discrete}
  .acc[open]::details-content{height:auto;opacity:1}
}
.key{margin:0 0 6px;font-size:var(--fs-m);font-weight:700;letter-spacing:.04em;user-select:all;overflow-wrap:anywhere}
.codes{display:grid;grid-template-columns:repeat(2,max-content);gap:8px 44px;margin:0 0 14px;font-size:var(--fs-lead);font-weight:700;user-select:all}
.sum{margin-left:1em;font-weight:500;color:var(--mute);font-size:var(--fs-small)}
/* what a file is: its state (a dot: good, enough, to change), then the facts */
.tec{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin-top:10px;min-height:1.5em;font-size:var(--fs-small);line-height:1.5;color:var(--mute);font-variant-numeric:tabular-nums}
.tec b{font-weight:600;color:var(--ink)}
.tec i{flex:none;align-self:center;width:9px;height:9px;margin-right:-5px;border-radius:50%;border:1.5px solid var(--klein)}
.tec i.ok{background:var(--klein)}.tec i.bad{background:var(--red);border-color:var(--red)}
.tec em{flex-basis:100%;font-style:normal}
.tec:has(.bad) em{color:var(--red)}
.tec.mini{flex:none;flex-wrap:nowrap;margin:0;gap:12px}
.tec.full{display:block;margin-top:clamp(14px,1.4vw,26px)}
.tec dl{margin:0;border-top:1px solid var(--line)}
.tec dl>div{display:flex;justify-content:space-between;gap:16px;padding:.5em 0;border-bottom:1px solid var(--line)}
.tec dd{margin:0;font-weight:600;color:var(--ink);text-align:right}
.tec.full p{display:flex;align-items:baseline;gap:10px;margin-top:12px}.tec.full p i{align-self:flex-start;margin:.48em 0 0}
.tec.full:has(.bad) p{color:var(--red)}
@media (max-width:1180px){.tec.mini{display:none}}
.none{padding:clamp(3rem,7vw,7rem) 0;color:var(--mute)}
.none b{display:block;width:72px;aspect-ratio:1;border-radius:50%;background:var(--klein);margin-bottom:28px}

/* Rows that can be moved */
.grip{display:grid;place-items:center;width:40px;height:44px;color:rgb(18 18 20 / .4);cursor:grab;touch-action:none;transition:color .3s}
.grip::before{content:"";width:12px;height:18px;background:radial-gradient(circle at 3px 3px,currentColor 1.6px,#0000 1.9px) 0 0/6px 6px}
.grip:hover{color:var(--klein)}
[data-s]{transition:translate .5s var(--ease),opacity .4s}
[data-s].drag{z-index:5;transition:none;pointer-events:none}
.sorting{user-select:none;-webkit-user-select:none}
.sorting [data-s]:not(.drag){opacity:.42}
.rw{border-top:1px solid var(--line)}
.rw>li{position:relative;display:flex;align-items:center;gap:clamp(10px,1.4vw,24px);border-bottom:1px solid var(--line);background:var(--bg)}
.rw .grip{margin-left:-12px;flex:none}
.rw-o{flex:1;min-width:0;display:flex;align-items:center;gap:clamp(14px,1.7vw,30px);padding:14px 0;text-align:left}
.rw-o .plate{flex:none;width:clamp(48px,calc(var(--w) * .044),84px)}
.rw-o .plate--none::after{width:40%}
.rw-t{display:block;min-width:0;font-size:var(--fs-row);font-weight:600;letter-spacing:-.034em;line-height:1.12;overflow-wrap:anywhere;transition:color .4s}
.rw-o:hover .rw-t{color:var(--klein)}
.rw-s{display:block;margin-top:4px;font-size:var(--fs-small);color:var(--mute)}
.rw-a{flex:none;width:clamp(11px,1vw,16px);aspect-ratio:1;border-top:2px solid currentColor;border-right:2px solid currentColor;rotate:45deg;margin-right:6px;transition:translate .6s var(--ease)}
.rw-o:hover .rw-a{translate:6px 0;color:var(--klein)}
/* yes or no: a dot */
.tg{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:var(--fs-small);font-weight:500;cursor:pointer;position:relative;white-space:nowrap;transition:color .3s}
.tg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.tg i{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgb(18 18 20 / .4);transition:background .35s,box-shadow .35s,scale .5s var(--ease)}
.tg input:checked+i{background:var(--klein);box-shadow:none}
.tg:hover{color:var(--klein)}.tg:hover i{scale:1.15}.tg:active i{scale:.85}
.tg input:focus-visible+i{outline:2px solid var(--klein);outline-offset:4px}

/* Fields */
.vt{display:block;width:100%;margin:0 0 clamp(1.5rem,2.6vw,2.75rem);padding:0 0 .1em;border:0;border-bottom:1px solid #0000;background:none;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.048em;line-height:1.06;color:var(--ink);resize:none;overflow:hidden;outline:none;field-sizing:content;transition:border-color .4s}
.vt::placeholder{color:rgb(18 18 20 / .22)}
.vt:hover{border-color:var(--line)}.vt:focus{border-color:var(--klein)}.vt[aria-invalid]{border-color:var(--red)}
.ef{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(1.75rem,2.8vw,3rem) var(--gut)}
.ef>.w2{grid-column:1/-1}
.fld ::placeholder{color:rgb(18 18 20 / .34)}
.ed-p{grid-column:1/4}.ed-f{grid-column:4/-1}
.ed-p .plate img{position:static;width:100%;height:auto;aspect-ratio:auto}
.ed-p .plate:not(.plate--none){aspect-ratio:auto}
.hint{font-size:var(--fs-small);color:var(--mute);margin-top:8px}

/* Texts with a form: what is seen is what is written. The tools are signs; their point says they are on */
.fld textarea{max-height:none}
.rt-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 32px}
.rt-h .fl{margin:0}
.rt-b{display:flex;flex-wrap:wrap;gap:0 clamp(14px,1.6vw,32px);margin:0 -10px}
.rt-b>div{display:flex}
.rt-b button{position:relative;display:grid;place-items:center;width:40px;height:44px;color:var(--ink);transition:color .3s,opacity .3s}
.rt-b b{font-size:20px;font-weight:700;line-height:1;letter-spacing:0}
.rt-b button::after{content:"";position:absolute;left:50%;bottom:2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--klein);scale:0;transition:scale .5s var(--ease)}
.rt-b [aria-pressed=true]{color:var(--klein)}.rt-b [aria-pressed=true]::after{scale:1}
.rt-b .o{opacity:0;transition:opacity .3s}.rt-b [aria-pressed=true] .o{opacity:1}
.rt-b button:hover{color:var(--klein)}.rt-b button:disabled{opacity:.25;pointer-events:none}
.rt-l{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 24px;padding-bottom:6px}
.rt-l[hidden]{display:none}
.rt-l input{flex:1;min-width:12em;padding:8px 0 9px!important;font-size:var(--fs-body)!important}
.rt[contenteditable]{min-height:calc(4.2em + 26px);padding:12px 0 14px;border-bottom:1px solid rgb(18 18 20 / .3);font-size:var(--fs-lead);line-height:1.5;letter-spacing:-.014em;outline:none;overflow-wrap:anywhere;transition:border-color .4s,box-shadow .4s}
.rt[contenteditable]:hover{border-color:var(--ink)}
.rt[contenteditable]:focus{border-color:var(--klein);box-shadow:0 1px 0 var(--klein)}
.rt.empty::before{content:attr(data-ph);float:left;height:0;color:rgb(18 18 20 / .34);pointer-events:none}
.rt[contenteditable] a{color:inherit;cursor:text}

/* Files: dropped, chosen or pasted */
.dz{position:relative;display:block;cursor:pointer}
.dz>input{position:absolute;inset:0;z-index:2;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.dz.plate--none:hover::after{scale:1.12}
/* a file above the page, or a picture in the hand: what can take it is ringed, what is under it turns blue and says what will happen.
   The edges of a picture of the layout add beside it */
/* the mouse over a picture: it says that a file can be dropped there (and a click still chooses one) */
@media (hover:hover){html:not(.files,.carry) :is(.dz:not(.busy):hover,.bk-p:hover)::before{content:"Glisser-déposer.";position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;text-wrap:balance;padding:10px;background:rgb(18 18 20 / .46);box-shadow:inset 0 0 0 2px var(--klein);color:var(--bg);font-size:clamp(1.0625rem,1.6vw,1.75rem);font-weight:700;letter-spacing:-.034em;line-height:1.08;pointer-events:none;animation:words .9s var(--ease) both}
  /* without a picture there is only its point: the words go below it, on no veil */
  html:not(.files,.carry) :is(.dz.plate--none,.mt:not(.has)>.dz):not(.busy):hover::before{place-items:end center;padding-bottom:9%;background:none}
  html:not(.files,.carry) .dz.plate--none:not(.busy):hover::before{color:var(--ink)}}
html.files [data-drop]::before,.can::before,.dz.over.in::before{content:"";position:absolute;inset:0;z-index:6;display:grid;place-items:center;text-align:center;text-wrap:balance;padding:10px;box-shadow:inset 0 0 0 2px var(--klein);color:var(--bg);font-size:clamp(1.0625rem,1.6vw,1.75rem);font-weight:700;letter-spacing:-.034em;line-height:1.08;pointer-events:none}
html.files [data-drop].over::before,.dz.over.in::before{content:attr(data-to) ".";background:var(--klein)}
html.files .dz.over.before::before{content:"Avant.";inset:0 60% 0 0}
html.files .dz.over.after::before{content:"Après.";inset:0 0 0 60%}
.dz.plate--none::after{transition:scale .5s var(--ease-io),translate .55s cubic-bezier(.22,1,.36,1)}
html.files .dz.plate--none.over::after{scale:7}html.files .dz.plate--none.over::before{background:none}
html.files .mt>.dz::before{z-index:3}
html.files .rw>li[data-drop]::before{box-shadow:none;place-items:center start;text-align:left;padding:0 24px}
html.files .rw .plate::before{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 0 2px var(--klein)}
html.files .cur{opacity:0!important}
html:is(.files,.carry) .ts{opacity:0;visibility:hidden}
/* a picture carried by the hand */
.ghost{position:fixed;left:0;top:0;z-index:120;width:min(220px,32vw);margin:18px 0 0 18px;pointer-events:none;box-shadow:0 24px 60px rgb(18 18 20 / .28)}
.ghost :is(img,video){display:block;width:100%;height:100%;object-fit:cover}
.lift{opacity:.35}
html.carry,html.carry *{user-select:none;-webkit-user-select:none}
.dz:has(input:focus-visible){outline:2px solid var(--klein);outline-offset:6px}
.up{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgb(250 250 248 / .88);opacity:0;visibility:hidden;transition:opacity .3s}
.busy>.up,li.busy .plate .up{opacity:1;visibility:visible}
.rw .up i{width:34px}.rw .up i{mask:radial-gradient(closest-side,#0000 calc(100% - 4px),#000 calc(100% - 3px))}
.up i{width:72px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--klein) calc(var(--u,0) * 1%),rgb(18 18 20 / .14) 0);mask:radial-gradient(closest-side,#0000 calc(100% - 6px),#000 calc(100% - 5px))}
.pa{display:flex;flex-wrap:wrap;gap:0 24px;margin-top:8px}
/* The layout of a project: the page, its margins, its four axes. --pm: the margin of the page */
#bk{position:relative}
.bk-n{margin-bottom:clamp(1.5rem,2.4vw,2.5rem)}
.sct>h2 .bk-auto{float:right;min-height:0;font-size:var(--fs-small)}
.bkc{--pm:clamp(12px,1.9vw,34px);--bg2:clamp(8px,.95vw,18px);position:relative;padding:var(--pm);box-shadow:inset 0 0 0 1px var(--line)}
.bkc-r{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--bg2);align-items:start}
.bkc-r.r-large{margin-top:34px}
.bk-add:has(+.r-tight){height:12px}
html:has(.bk-bar) .ts{bottom:132px}
.bk1{position:relative;min-width:0;outline:none}
.bk1.w{margin:0 calc(var(--pm) * -1)}
.bk1::after{content:"";position:absolute;inset:-5px;z-index:3;box-shadow:inset 0 0 0 2px var(--klein);opacity:0;pointer-events:none;transition:opacity .2s}
.bk1.w::after{inset:-3px 0}
@media (hover:hover){.bk1:hover::after{opacity:.28}}
.bk1.sel::after,.bk1:focus-visible::after{opacity:1}
.bk1.t-text,.bk1.t-info{padding:6px 0}
.bk1>.grip{position:absolute;right:4px;top:4px;z-index:5;width:36px;height:36px;background:var(--bg);color:var(--ink);opacity:0;transition:opacity .2s}
.bk1:hover>.grip,.bk1.sel>.grip{opacity:1}
.bk1.lift{opacity:.3}
.bk-p{position:relative;overflow:clip;background:var(--tint);cursor:grab}
