title: { fr: "Services", en: "Services" }
intro:
  fr: "Un studio pluridisciplinaire : stratégie, image, mouvement, espace et web. Nous assemblons l'équipe qu'il faut pour chaque projet, rien de plus."
  en: "A multidisciplinary studio: strategy, image, motion, space and web. We assemble the team each project needs, nothing more."
process:
  title: { fr: "Comment nous travaillons", en: "How we work" }
  steps:
    - { title: { fr: "Écouter", en: "Listen" }, text: { fr: "Un premier échange pour comprendre la marque, le contexte et ce qui doit changer.", en: "A first conversation to understand the brand, the context and what needs to change." } }
    - { title: { fr: "Écrire", en: "Write" }, text: { fr: "Une direction claire, sur une page : l'idée, le ton, le périmètre, le calendrier.", en: "A clear direction on one page: the idea, the tone, the scope, the timeline." } }
    - { title: { fr: "Fabriquer", en: "Make" }, text: { fr: "Design, tournage, 3D, code. Vous voyez le travail avancer, pas seulement le résultat.", en: "Design, shooting, 3D, code. You see the work progress, not just the result." } }
    - { title: { fr: "Livrer", en: "Deliver" }, text: { fr: "Fichiers, chartes, formations : tout ce qu'il faut pour que la marque vive sans nous.", en: "Files, guidelines, training: everything the brand needs to live without us." } }
pricing:
  fr: "Chaque projet est chiffré sur devis, après un premier échange."
  en: "Every project is quoted individually, after a first conversation."
