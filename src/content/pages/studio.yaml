title: { fr: "Studio", en: "Studio" }
lead:
  fr: "Un studio resserré, installé sur la Côte d'Azur, qui travaille pour des marques d'ici et d'ailleurs."
  en: "A tight studio based on the French Riviera, working for brands from here and beyond."
story:
  fr: "moyo est né d'une conviction simple : une marque se juge à ce qu'on voit et à ce qu'on ressent avant même de lire. Nous avons réuni sous un même toit les métiers qui fabriquent cette première impression, du graphisme à la 3D, du tournage au code. Entre Monaco, Nice, Cannes et Saint-Tropez, nous travaillons pour des maisons de luxe, des hôtels, des chantiers navals, des festivals et des entreprises qui démarrent."
  en: "moyo was born from a simple belief: a brand is judged by what people see and feel before they read a word. We brought together under one roof the crafts that build that first impression, from graphic design to 3D, from shooting to code. Between Monaco, Nice, Cannes and Saint-Tropez, we work for luxury houses, hotels, shipyards, festivals and companies just getting started."
values:
  title: { fr: "Ce qui nous tient", en: "What we hold to" }
  items:
    - { title: { fr: "Exigence", en: "Rigour" }, text: { fr: "Nous préférons refaire que livrer à peu près.", en: "We would rather redo than deliver something almost right." } }
    - { title: { fr: "Discrétion", en: "Discretion" }, text: { fr: "Certains de nos meilleurs projets ne sont pas sur ce site. C'est normal.", en: "Some of our best projects aren't on this site. That's how it should be." } }
    - { title: { fr: "Lumière", en: "Light" }, text: { fr: "Elle est notre première matière, à l'écran comme sur la Méditerranée.", en: "It is our first material, on screen as on the Mediterranean." } }
    - { title: { fr: "Durée", en: "Longevity" }, text: { fr: "Une identité doit encore tenir dans dix ans.", en: "An identity should still hold in ten years." } }
team:
  title: { fr: "L'équipe", en: "The team" }
network:
  title: { fr: "Le réseau", en: "The network" }
  text:
    fr: "Autour du studio, un cercle de chefs opérateurs, ingénieurs du son, imprimeurs d'art et régisseurs avec qui nous travaillons depuis des années. Nous les appelons quand le projet le demande."
    en: "Around the studio, a circle of cinematographers, sound engineers, fine-art printers and stage managers we have worked with for years. We bring them in when the project calls for it."
