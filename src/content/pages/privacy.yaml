# Brouillon à faire valider par un juriste.
title: { fr: "Confidentialité", en: "Privacy" }
updated: "2026-11-17"
body:
  fr: |
    ## En bref
    Ce site ne dépose aucun cookie publicitaire ni de mesure d'audience. Les seules données collectées sont celles que vous nous envoyez via le formulaire de contact.

    ## Responsable du traitement
    [Raison sociale], [adresse]. Contact : hello@moyo.example

    ## Formulaire de contact
    Données collectées : nom, adresse e-mail, société (facultatif), secteur, message.
    Finalité : répondre à votre demande et, le cas échéant, établir un devis.
    Base légale : mesures précontractuelles prises à votre demande (article 6.1.b du RGPD).
    Durée de conservation : 3 ans à compter de notre dernier échange, puis suppression.
    Destinataires : l'équipe moyo uniquement. Les messages transitent par notre prestataire d'envoi d'e-mails [nom du prestataire].

    ## Protection anti-spam
    Le formulaire est protégé par Cloudflare Turnstile, qui analyse des signaux techniques du navigateur pour distinguer un humain d'un robot, sans cookie publicitaire. Voir la politique de confidentialité de Cloudflare.

    ## Stockage local
    Votre choix de thème (clair ou sombre) est enregistré dans votre navigateur (localStorage). Il n'est jamais transmis.

    ## Vos droits
    Vous disposez d'un droit d'accès, de rectification, d'effacement, d'opposition et de limitation sur vos données. Écrivez-nous à hello@moyo.example. Vous pouvez aussi adresser une réclamation à la CNIL (www.cnil.fr).
  en: |
    ## In short
    This website sets no advertising or analytics cookies. The only data collected is what you send us through the contact form.

    ## Data controller
    [Company name], [address]. Contact: hello@moyo.example

    ## Contact form
    Data collected: name, email address, company (optional), sector, message.
    Purpose: replying to your request and, where relevant, preparing a quote.
    Legal basis: pre-contractual steps taken at your request (Article 6(1)(b) GDPR).
    Retention: 3 years from our last exchange, then deletion.
    Recipients: the moyo team only. Messages are relayed by our email provider [provider name].

    ## Spam protection
    The form is protected by Cloudflare Turnstile, which analyses technical browser signals to tell humans from bots, without advertising cookies. See Cloudflare's privacy policy.

    ## Local storage
    Your theme choice (light or dark) is stored in your browser (localStorage). It is never transmitted.

    ## Your rights
    You have the right to access, rectify, erase, object to and restrict the processing of your data. Write to hello@moyo.example. You may also lodge a complaint with the CNIL (www.cnil.fr).
