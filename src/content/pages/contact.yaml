title: { fr: "Parlons de votre projet.", en: "Tell us about your project." }
text:
  fr: "Quelques lignes suffisent : qui vous êtes, ce que vous avez en tête, et quand. Nous répondons sous 48 heures avec une proposition de rendez-vous. Tous nos projets sont sur devis."
  en: "A few lines are enough: who you are, what you have in mind, and when. We reply within 48 hours to set up a call. Every project is quoted individually."
