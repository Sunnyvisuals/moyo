blocks:
  - type: text
    title: { fr: "Le contexte", en: "Context" }
    body:
      fr: "Pour sa réouverture, l'hôtel voulait parler à une clientèle qui fuit le bruit. Nous avons travaillé la lumière du lieu comme matière première : des persiennes, de la pierre, des heures précises. Le site se lit comme une journée sur place."
      en: "For its reopening, the hotel wanted to speak to guests who run from noise. We used the light of the place as raw material: shutters, stone, precise hours of the day. The website reads like a day on site."
