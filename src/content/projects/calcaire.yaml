    layout: full
    src: ../../assets/uploads/calcaire-1.jpg
    alt: { fr: "Lumière de persiennes sur un mur de pierre", en: "Shutter light on a stone wall" }
  - type: quote
    body:
      fr: "Le site donne envie de ne rien faire, ce qui est exactement le but."
      en: "The website makes you want to do nothing, which is exactly the point."
    author: "Hôtel Calcaire"
