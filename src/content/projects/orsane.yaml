placeholder: true
blocks:
  - type: text
    title: { fr: "Le contexte", en: "Context" }
    body:
      fr: "La maison ouvrait sa première adresse à Monaco. Le brief tenait en une phrase : être reconnue sans jamais montrer un bijou en entier. Nous avons construit l'identité autour d'un seul geste, l'anneau de lumière, décliné en logotype animé, écrins et campagne 3D."
      en: "The house was opening its first address in Monaco. The brief fit in one sentence: be recognised without ever showing a whole jewel. We built the identity around a single gesture, the ring of light, rolled out as an animated logotype, boxes and a 3D campaign."
  - type: image
    layout: full
    src: ../../assets/uploads/orsane-1.jpg
    alt: { fr: "Anneau de lumière dorée sur fond nuit", en: "Ring of golden light on a night background" }
  - type: quote
    body:
      fr: "On voulait qu'on se souvienne d'un reflet, pas d'un logo."
      en: "We wanted people to remember a reflection, not a logo."
    author: "Maison Orsane"
  - type: diptych
    left: ../../assets/uploads/orsane-2.jpg
    right: ../../assets/uploads/orsane-3.jpg
