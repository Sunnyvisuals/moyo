blocks:
  - type: text
    title: { fr: "Le contexte", en: "Context" }
    body:
      fr: "Quatre cents anneaux, des visiteurs de vingt nationalités et aucune signalétique cohérente. Nous avons dessiné un système de pictogrammes et de typographie lisible de jour comme de nuit, puis la ligne éditoriale de la marina sur les réseaux."
      en: "Four hundred berths, visitors of twenty nationalities and no coherent signage. We designed a system of pictograms and typography readable by day and by night, then the marina's editorial line on social media."
