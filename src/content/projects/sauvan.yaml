    body:
      fr: "L'atelier lançait sa première collection sans budget de tournage. Nous avons modélisé les flacons à partir des plans du verrier et composé chaque visuel de campagne en 3D, avec la lumière d'une fin d'après-midi à Grasse."
      en: "The atelier was launching its first collection with no shooting budget. We modelled the bottles from the glassmaker's drawings and built every campaign image in 3D, lit like a late afternoon in Grasse."
