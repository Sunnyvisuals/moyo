blocks:
  - type: text
    title: { fr: "Le contexte", en: "Context" }
    body:
      fr: "Le chantier devait présenter le bateau à ses premiers clients alors qu'il était encore en cale sèche. Nous avons reconstruit la coque en 3D, tourné de vraies prises de mer au large du cap d'Antibes et assemblé les deux en un film de deux minutes."
      en: "The shipyard had to present the boat to its first clients while it was still in dry dock. We rebuilt the hull in 3D, shot real sea plates off Cap d'Antibes and composited both into a two-minute film."
