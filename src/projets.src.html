<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAFAF8">
<!--meta-->__META__<!--/meta-->
__HEAD__
<style>
__CSS__
/* ---------- Every project: a contact sheet on the four axes ---------- */
main{min-height:100vh;min-height:100svh;padding:calc(var(--hdr) + clamp(1.5rem,4.5vw,4.5rem)) var(--edge) var(--sec)}
.page-t{margin-bottom:var(--gap)}
/* Filters: plain words. The current one is blue; the categories still waiting for a project are faded. */
.filters{display:flex;flex-wrap:wrap;gap:0 clamp(18px,2vw,34px);margin-bottom:clamp(3rem,5vw,5.5rem);font-weight:500}
.filters button{display:inline-flex;align-items:baseline;gap:.35em;min-height:44px;color:var(--mute);transition:color .4s}
.filters .n{font-size:.7em;translate:0 -.35em;font-weight:500}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{color:var(--klein)}
.filters button:disabled{opacity:.42;cursor:default;color:var(--mute)}
html:not(.js) .filters{display:none}
.index{row-gap:clamp(3.5rem,6vw,6.5rem)}
.index>li{grid-column:span 3}
.index>li[hidden]{display:none}
.index .cap{display:grid;grid-template-columns:1fr;gap:3px;padding-top:16px}
.index .r-title{font-weight:600}
.index .r-desc{display:none}
.index .r-type,.index .r-meta{font-size:var(--fs-small);color:var(--mute);line-height:1.4}
.empty{color:var(--mute)}
@media (max-width:1180px){.index>li{grid-column:span 6}}
@media (max-width:480px){.index>li{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){::view-transition-group(*){animation-duration:.6s;animation-timing-function:var(--ease)}}
</style>
</head>
<body>
<a class="skip" href="#main" data-i="skip">Aller au contenu</a>
__CHROME_HEAD__

<div class="under"><main id="main">
  <nav class="crumbs" aria-label="Vous êtes ici" data-ia="here"><ol><li><a href="/" data-i="home">Accueil</a></li><li aria-current="page"><span data-i="title2">Projets</span></li></ol></nav>
  <h1 class="t-hero page-t"><span data-i="title">Projets</span><i class="dot">&#8288;<b></b></i></h1>
  <div class="filters" id="filters" role="group" aria-label="Filtrer par catégorie" data-ia="filtersAria"></div>
  <p class="sr" id="count" aria-live="polite"></p>
  <ol class="g index" id="projects">__ROWS__</ol>
  <p class="empty" id="empty" hidden data-i="empty">Aucun projet dans cette catégorie pour l’instant.</p>
  <a class="nm-link g next" href="/#contact"><span class="nm" data-i="contact">Contact</span><span class="nm-role q4" data-i="nextS">Étape suivante</span></a>
  <script type="application/json" id="moyo-data">__DATA__</script>
</main></div>
