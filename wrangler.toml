# Cloudflare Pages: static files from dist/ + Functions from functions/
name = "moyo"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Projects and images.
#   npx wrangler kv namespace create MOYO
[[kv_namespaces]]
binding = "MOYO"
id = "de946356b5934cbfa13b6e0ac49d3052"

# Secrets (never in this file):
#   npx wrangler pages secret put ADMIN_PASSWORD
# For local dev, put ADMIN_PASSWORD=... in .dev.vars (ignored by git).
