# Cloudflare Workers + static assets: site statique servi depuis dist/
name = "moyo"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"

# Projects and images KV (conservé pour un futur backend).
#   npx wrangler kv namespace create MOYO
[[kv_namespaces]]
binding = "MOYO"
id = "b607180688c748049ddacd96798e1d55"

# Secrets (never in this file):
#   npx wrangler secret put ADMIN_PASSWORD
# For local dev, put ADMIN_PASSWORD=... in .dev.vars (ignored by git).
